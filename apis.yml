aid: evermore
name: Evermore
description: >-
  Evermore (formerly Soda Health, rebranded in October 2025) is a Chicago-based
  healthcare technology company, founded in 2021, that administers "Smart Benefits"
  — supplemental benefit programs connecting Medicare Advantage, Medicaid, and
  commercial health-plan members to the products and services they need. Its Smart
  Benefits card restricts spending to eligible items at the point of sale (item-level
  adjudication) across categories such as healthy food, OTC medications, transportation,
  and utilities, and can hold separate funds per benefit type. Evermore partners with
  payers, health plans, and a retail network (including grocers such as Save A Lot) to
  deliver consumer-directed health (CDH) accounts, Medicare Advantage supplemental
  benefits, Medicaid value-added benefits, and ICHRA administration through an
  API-based platform. The company runs a HIPAA/CMS-compliant program and is backed by
  General Catalyst, Lightspeed Venture Partners, Qiming, Define Ventures, and SVB Capital.
